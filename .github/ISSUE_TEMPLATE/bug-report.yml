name: Site bug
description: Something on the site is broken (layout, navigation, search, interactive components).
labels: ["bug"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      placeholder: https://assured-methodology.vercel.app/docs/alert/quiz/
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: "Browser + version, OS, device (e.g. Safari on iOS, Chrome on Windows)"
    validations:
      required: false
  - type: dropdown
    id: assistive-tech
    attributes:
      label: Assistive tech / settings
      description: Select any that were in use when the problem happened.
      multiple: true
      options:
        - Screen reader
        - Keyboard only
        - Reduced motion
        - Forced colors / high contrast
        - JavaScript disabled
        - Print
    validations:
      required: false
