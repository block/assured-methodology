name: Site bug
description: Something on the site is broken — layout, navigation, search, interactive components.
labels: ["bug"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      placeholder: https://assured-methodology.vercel.app/docs/alert/quiz/
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Safari 26 on iPhone 15, Chrome 140 on Windows 11, ...
    validations:
      required: false
