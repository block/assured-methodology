name: Content correction
description: Report a factual, technical, or citation error in the methodology content.
labels: ["content", "accuracy"]
body:
  - type: markdown
    attributes:
      value: |
        Accuracy reports are the highest-value contribution this project
        receives. A correction with a primary source is often merged as-is.
  - type: input
    id: page
    attributes:
      label: Page
      description: URL or repo path of the page with the error.
      placeholder: /docs/risk/framework or src/content/docs/risk/framework.mdx
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: What the page says
      description: Quote the claim as it appears on the page.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: What is actually correct
      description: The corrected claim, as you would want it to read.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Primary source
      description: |
        Link the authority for the correction: the MITRE technique page,
        CFR section, RFC, vendor documentation, or published report.
    validations:
      required: true
