name: Content correction
description: Report a factual, technical, or citation error in the methodology content.
labels: ["content", "accuracy"]
body:
  - type: markdown
    attributes:
      value: |
        Accuracy reports are the highest-value contribution this project
        receives. A correction with a primary source is often applied as written.
  - type: input
    id: page
    attributes:
      label: Page
      description: URL or repo path of the page with the error.
      placeholder: /docs/risk/framework/ or src/content/docs/risk/framework.mdx
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: What the page says
      description: Quote the claim as it appears on the page.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: What is actually correct
      description: The corrected claim, as you would want it to read.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Primary source
      description: |
        Link the authority for the correction: the MITRE technique page,
        CFR section, RFC, vendor documentation, or published report. If the
        evidence is first-hand (for example, how a console actually displays
        a field), describe it and attach a redacted screenshot.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Site version and date viewed
      description: The version is shown in the site footer.
      placeholder: v1.2 (footer), 2026-10-06
    validations:
      required: false
