name: Suggestion
description: Propose an improvement to the methodology content or the site.
labels: ["enhancement"]
body:
  - type: textarea
    id: suggestion
    attributes:
      label: What would you change or add
      description: The improvement you have in mind, and where it belongs if you know.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Why it helps
      description: The gap or friction this addresses — a triage situation the content doesn't cover, a page that's hard to use, something you had to work out on your own.
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Related page (if any)
      placeholder: /docs/risk/framework or https://assured-methodology.vercel.app/glossary/
    validations:
      required: false
