name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Version comes from the packageManager field in package.json so CI and
      # local builds can never drift.
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (biome)
        run: pnpm exec biome ci src

      - name: Type check (astro check)
        run: pnpm run typecheck

      - name: Glossary registry matches the MDX sources
        run: pnpm run glossary:check

      - name: Every DefineTerm tooltip resolves
        run: pnpm run check:terms

      # pnpm build re-runs both checks above by design; the labeled steps
      # exist so a failure names the broken contract instead of "build".
      - name: Build site and search index
        run: pnpm build

      - name: Internal links and anchors resolve
        run: pnpm run check:links
